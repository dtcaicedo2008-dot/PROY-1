<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Ahorcado - GameZone SENA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eee5ff, #f8f5ff);
            color: #29213d;
        }

        .contenedor {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto;
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(80, 45, 120, .15);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #6c3bc4;
            font-size: 38px;
            margin-bottom: 8px;
        }

        header p {
            color: #777;
        }

        .informacion {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .tarjeta {
            background: #f4efff;
            padding: 15px 25px;
            border-radius: 15px;
            min-width: 250px;
            text-align: center;
        }

        .tarjeta small {
            color: #8a6bbd;
            font-weight: bold;
        }

        .tarjeta h3 {
            margin-top: 6px;
            color: #4e278d;
        }

        .juego {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
        }

        /* =========================
           MUÑECO
        ========================= */

        .zona-muneco {
            min-height: 430px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf8ff;
            border-radius: 25px;
            position: relative;
        }

        .muneco {
            position: relative;
            width: 220px;
            height: 370px;
        }

        .parte {
            position: absolute;
            opacity: 0;
            transform: scale(.7);
            transition: .4s ease;
        }

        /* CABEZA */

        .cabeza {
            width: 105px;
            height: 105px;
            background: #ffd7b5;
            border: 4px solid #5d3695;
            border-radius: 50%;
            top: 25px;
            left: 57px;
            z-index: 5;
        }

        /* CABELLO */

        .cabello {
            width: 115px;
            height: 65px;
            background: #55308c;
            border-radius: 60px 60px 25px 25px;
            top: 17px;
            left: 52px;
            z-index: 6;
        }

        .cabello::before,
        .cabello::after {
            content: "";
            position: absolute;
            width: 32px;
            height: 70px;
            background: #55308c;
            top: 25px;
            border-radius: 50%;
        }

        .cabello::before {
            left: -10px;
        }

        .cabello::after {
            right: -10px;
        }

        /* OJOS */

        .ojo {
            position: absolute;
            width: 9px;
            height: 13px;
            background: #29213d;
            border-radius: 50%;
            top: 45px;
        }

        .ojo1 {
            left: 27px;
        }

        .ojo2 {
            right: 27px;
        }

        /* BOCA */

        .boca {
            position: absolute;
            width: 25px;
            height: 12px;
            border-bottom: 4px solid #bd3d76;
            border-radius: 50%;
            bottom: 25px;
            left: 36px;
        }

        /* CUERPO */

        .cuerpo {
            width: 100px;
            height: 120px;
            background: linear-gradient(135deg, #b08aff, #713fc4);
            border: 4px solid #542b91;
            border-radius: 30px;
            top: 130px;
            left: 60px;
            z-index: 3;
        }

        /* BRAZOS */

        .brazo {
            width: 25px;
            height: 95px;
            background: #ffd7b5;
            border: 3px solid #5d3695;
            border-radius: 20px;
            top: 140px;
            z-index: 2;
        }

        .brazo1 {
            left: 35px;
            transform: rotate(25deg);
        }

        .brazo2 {
            right: 35px;
            transform: rotate(-25deg);
        }

        /* PIERNAS */

        .pierna {
            width: 28px;
            height: 100px;
            background: #393080;
            border: 3px solid #29235d;
            border-radius: 20px;
            top: 240px;
            z-index: 1;
        }

        .pierna1 {
            left: 70px;
            transform: rotate(7deg);
        }

        .pierna2 {
            right: 70px;
            transform: rotate(-7deg);
        }

        /* ZAPATOS */

        .zapato {
            width: 50px;
            height: 25px;
            background: #29235d;
            border-radius: 25px;
            top: 330px;
            z-index: 4;
        }

        .zapato1 {
            left: 45px;
        }

        .zapato2 {
            right: 45px;
        }

        /* ERRORES */

        .error1 .cabeza,
        .error1 .cabello {
            opacity: 1;
            transform: scale(1);
        }

        .error2 .cabeza,
        .error2 .cabello,
        .error2 .cuerpo {
            opacity: 1;
            transform: scale(1);
        }

        .error3 .cabeza,
        .error3 .cabello,
        .error3 .cuerpo,
        .error3 .brazo1 {
            opacity: 1;
            transform: scale(1);
        }

        .error4 .cabeza,
        .error4 .cabello,
        .error4 .cuerpo,
        .error4 .brazo1,
        .error4 .brazo2 {
            opacity: 1;
            transform: scale(1);
        }

        .error5 .cabeza,
        .error5 .cabello,
        .error5 .cuerpo,
        .error5 .brazo1,
        .error5 .brazo2,
        .error5 .pierna1 {
            opacity: 1;
            transform: scale(1);
        }

        .error6 .parte {
            opacity: 1;
            transform: scale(1);
        }

        /* =========================
           PANEL DEL JUEGO
        ========================= */

        .panel {
            text-align: center;
        }

        .vidas {
            background: #f4efff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #vidas {
            color: #d43c68;
            font-size: 28px;
        }

        .palabra {
            font-size: 35px;
            letter-spacing: 12px;
            font-weight: bold;
            color: #6135a8;
            min-height: 55px;
            margin: 25px 0;
        }

        .letras {
            color: #777;
            min-height: 25px;
            margin-bottom: 20px;
        }

        input {
            width: 100px;
            padding: 13px;
            border: 2px solid #c9b5ec;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            outline: none;
        }

        input:focus {
            border-color: #7042c3;
        }

        button {
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 5px;
            transition: .2s;
        }

        .probar {
            background: #7042c3;
            color: white;
        }

        .probar:hover {
            background: #542b91;
            transform: translateY(-2px);
        }

        .nuevo {
            background: #eee4ff;
            color: #6135a8;
        }

        .inicio {
            background: #29213d;
            color: white;
        }

        .mensaje {
            min-height: 50px;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .correcto {
            color: #159447;
        }

        .error {
            color: #d43c68;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }

        /* RESPONSIVE */

        @media (max-width: 750px) {
            .juego {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 30px;
            }

            .zona-muneco {
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <header>
        <h1>🎯 EL AHORCADO</h1>
        <p>GameZone SENA - ¡Adivina la palabra!</p>
    </header>

    <div class="informacion">

        <div class="tarjeta">
            <small>📚 TEMA</small>
            <h3 id="tema">Cargando...</h3>
        </div>

        <div class="tarjeta">
            <small>💡 PISTA</small>
            <h3 id="pista">Cargando...</h3>
        </div>

    </div>

    <div class="juego">

        <!-- MUÑECO -->

        <div class="zona-muneco">

            <div class="muneco" id="muneco">

                <div class="parte cabello"></div>

                <div class="parte cabeza">
                    <div class="ojo ojo1"></div>
                    <div class="ojo ojo2"></div>
                    <div class="boca"></div>
                </div>

                <div class="parte cuerpo"></div>

                <div class="parte brazo brazo1"></div>

                <div class="parte brazo brazo2"></div>

                <div class="parte pierna pierna1"></div>

                <div class="parte pierna pierna2"></div>

                <div class="parte zapato zapato1"></div>

                <div class="parte zapato zapato2"></div>

            </div>

        </div>


        <!-- JUEGO -->

        <div class="panel">

            <div class="vidas">
                ❤️ Vidas:
                <span id="vidas">6</span>
            </div>

            <h2>Palabra</h2>

            <div
                class="palabra"
                id="palabra">
            </div>

            <div class="letras">
                Letras usadas:
                <strong id="usadas">Ninguna</strong>
            </div>

            <div>

                <input
                    type="text"
                    id="letra"
                    maxlength="1"
                    placeholder="A"
                >

                <button
                    class="probar"
                    onclick="probarLetra()">
                    ✨ Probar
                </button>

            </div>

            <div
                class="mensaje"
                id="mensaje">
            </div>

            <button
                class="nuevo"
                onclick="nuevoJuego()">
                🔄 Nuevo juego
            </button>

            <button
                class="inicio"
                onclick="volverInicio()">
                🏠 Inicio
            </button>

        </div>

    </div>

    <footer>
        <strong>GameZone </strong>
        <br>
        Proyecto Productivo - Programación de Software
    </footer>

</div>


<script>

    /* ============================
       PALABRAS DEL JUEGO
    ============================ */

    const palabras = [
        {
            palabra: "GATO",
            tema: "🐾 Animales",
            pista: "Es un animal doméstico que dice miau."
        },
        {
            palabra: "PERRO",
            tema: "🐾 Animales",
            pista: "Es conocido como el mejor amigo del hombre."
        },
        {
            palabra: "LEON",
            tema: "🐾 Animales",
            pista: "Es conocido como el rey de la selva."
        },
        {
            palabra: "MARIPOSA",
            tema: "🐾 Animales",
            pista: "Tiene alas y pasa por una metamorfosis."
        },
        {
            palabra: "COLOMBIA",
            tema: "🌎 Países",
            pista: "País de América del Sur cuya capital es Bogotá."
        },
        {
            palabra: "BRASIL",
            tema: "🌎 Países",
            pista: "País famoso por el carnaval de Río."
        },
        {
            palabra: "HTML",
            tema: "💻 Programación",
            pista: "Lenguaje que crea la estructura de una página web."
        },
        {
            palabra: "JAVASCRIPT",
            tema: "💻 Programación",
            pista: "Lenguaje que permite agregar interactividad a una página."
        }
    ];


    let palabraActual = "";
    let vidas = 6;
    let letrasUsadas = [];
    let terminado = false;


    /* ============================
       NUEVO JUEGO
    ============================ */

    function nuevoJuego() {

        const aleatoria =
            Math.floor(Math.random() * palabras.length);

        palabraActual =
            palabras[aleatoria].palabra;

        document.getElementById("tema").textContent =
            palabras[aleatoria].tema;

        document.getElementById("pista").textContent =
            palabras[aleatoria].pista;

        vidas = 6;
        letrasUsadas = [];
        terminado = false;

        document.getElementById("vidas").textContent =
            vidas;

        document.getElementById("usadas").textContent =
            "Ninguna";

        document.getElementById("mensaje").textContent =
            "";

        document.getElementById("muneco").className =
            "muneco";

        document.getElementById("letra").value = "";

        mostrarPalabra();
    }


    /* ============================
       MOSTRAR PALABRA
    ============================ */

    function mostrarPalabra() {

        let resultado = "";

        for (let letra of palabraActual) {

            if (letrasUsadas.includes(letra)) {
                resultado += letra + " ";
            } else {
                resultado += "_ ";
            }

        }

        document.getElementById("palabra").textContent =
            resultado;
    }


    /* ============================
       PROBAR LETRA
    ============================ */

    function probarLetra() {

        if (terminado) {
            return;
        }

        const input =
            document.getElementById("letra");

        const letra =
            input.value.toUpperCase().trim();

        input.value = "";

        if (!letra) {
            document.getElementById("mensaje").textContent =
                "✏️ Escribe una letra.";
            return;
        }

        if (!/^[A-ZÑ]$/.test(letra)) {
            document.getElementById("mensaje").textContent =
                "⚠️ Escribe solamente una letra.";
            return;
        }

        if (letrasUsadas.includes(letra)) {
            document.getElementById("mensaje").textContent =
                "🔄 Ya utilizaste esa letra.";
            return;
        }

        letrasUsadas.push(letra);

        document.getElementById("usadas").textContent =
            letrasUsadas.join(" • ");

        if (palabraActual.includes(letra)) {

            document.getElementById("mensaje").textContent =
                "🎉 ¡Muy bien! Esa letra sí está.";

        } else {

            vidas--;

            document.getElementById("vidas").textContent =
                vidas;

            actualizarMuneco();

            document.getElementById("mensaje").textContent =
                "❌ Esa letra no está.";

        }

        mostrarPalabra();

        comprobarJuego();
    }


    /* ============================
       MUÑECO SEGÚN ERRORES
    ============================ */

    function actualizarMuneco() {

        const errores = 6 - vidas;

        document.getElementById("muneco").className =
            "muneco error" + errores;
    }


    /* ============================
       COMPROBAR SI GANÓ O PERDIÓ
    ============================ */

    function comprobarJuego() {

        let gano = true;

        for (let letra of palabraActual) {

            if (!letrasUsadas.includes(letra)) {
                gano = false;
            }

        }

        if (gano) {

            terminado = true;

            document.getElementById("mensaje").innerHTML =
                "🎉 ¡GANASTE! 💜<br>La palabra era " +
                palabraActual;

            return;
        }

        if (vidas <= 0) {

            terminado = true;

            document.getElementById("mensaje").innerHTML =
                "😢 ¡PERDISTE!<br>La palabra era " +
                palabraActual;
        }
    }


    /* ============================
       VOLVER AL DASHBOARD
    ============================ */

    function volverInicio() {

        window.location.href = "dashboard.html";

    }


    /* ============================
       ENTER PARA JUGAR
    ============================ */

    document.getElementById("letra")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                probarLetra();
            }

        });


    /* INICIAR AUTOMÁTICAMENTE */

    nuevoJuego();

</script>

</body>
</html>
