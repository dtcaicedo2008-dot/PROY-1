<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Ahorcado - GameZone SENA</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        🎮 GameZone SENA
    </div>

    <nav>

        <a href="dashboard.html">
            Inicio
        </a>

        <a href="acerca.html">
            Acerca de
        </a>

    </nav>

</header>


<main class="game-page ahorcado-page">


    <div class="titulo-juego">

        <span>🎯</span>

        <h1>El Ahorcado</h1>

        <span>⚡</span>

    </div>


    <p class="subtitulo-ahorcado">

        Adivina la palabra usando las pistas.

    </p>


    <!-- INFORMACIÓN -->

    <div class="ayuda-ahorcado">

        <div>

            📚

            <strong>Categoría</strong>

            <span id="categoria">
                Tecnología
            </span>

        </div>


        <div>

            💡

            <strong>Pista</strong>

            <span id="pista">
                Pista
            </span>

        </div>

    </div>



    <!-- PERSONAJE -->

    <div class="personaje-ahorcado">

        <div class="nube">
            ☁️
        </div>


        <div id="parte1"
             class="parte-personaje cabeza">

            😐

        </div>


        <div id="parte2"
             class="parte-personaje cuerpo">

            👕
            
        </div>


        <div id="parte3"
             class="parte-personaje brazo-izq">

            💪

        </div>


        <div id="parte4"
             class="parte-personaje brazo-der">

            💪

        </div>


        <div id="parte5"
             class="parte-personaje pierna-izq">

            🦵

        </div>


        <div id="parte6"
             class="parte-personaje pierna-der">

            🦵

        </div>


        <div class="suelo">

            ━━━━━━━━━

        </div>

    </div>



    <!-- ERRORES -->

    <div class="errores-ahorcado">

        ❤️ Errores:

        <strong id="errores">
            0
        </strong>

        / 6

    </div>



    <!-- PALABRA -->

    <div id="palabra"
         class="palabra-ahorcado">

    </div>


    <p class="elige-letra">

        👆 Selecciona una letra

    </p>



    <!-- LETRAS -->

    <div id="letras"
         class="letras letras-bonitas">

    </div>



    <!-- MENSAJE -->

    <div id="mensajeJuego"
         class="mensaje-ahorcado">

    </div>



    <!-- BOTÓN -->

    <button onclick="nuevoJuego()"
            class="btn-principal">

        🔄 Nueva palabra

    </button>


    <br>
    <br>


    <a href="dashboard.html"
       class="btn-secundario">

        ⬅ Volver a los juegos

    </a>


</main>



<script>


const palabras = [

    {
        palabra: "JAVASCRIPT",
        categoria: "💻 Tecnología",
        pista: "Lenguaje utilizado para darle interacción a las páginas web."
    },

    {
        palabra: "COMPUTADOR",
        categoria: "💻 Tecnología",
        pista: "Dispositivo que utilizamos para estudiar, trabajar y jugar."
    },

    {
        palabra: "VIDEOJUEGO",
        categoria: "🎮 Entretenimiento",
        pista: "Juego electrónico que puede jugarse en una consola o computador."
    },

    {
        palabra: "FUTBOL",
        categoria: "⚽ Deportes",
        pista: "Deporte en el que dos equipos intentan marcar goles."
    },

    {
        palabra: "BALONCESTO",
        categoria: "🏀 Deportes",
        pista: "Deporte en el que los jugadores intentan encestar el balón."
    },

    {
        palabra: "MURCIELAGO",
        categoria: "🐾 Animales",
        pista: "Mamífero que puede volar y suele salir durante la noche."
    },

    {
        palabra: "DELFIN",
        categoria: "🐬 Animales",
        pista: "Animal marino conocido por ser muy inteligente."
    },

    {
        palabra: "ELEFANTE",
        categoria: "🐘 Animales",
        pista: "Animal terrestre muy grande que tiene una trompa."
    },

    {
        palabra: "VOLCAN",
        categoria: "🌋 Naturaleza",
        pista: "Puede expulsar lava, cenizas y gases."
    },

    {
        palabra: "ARCOIRIS",
        categoria: "🌈 Naturaleza",
        pista: "Fenómeno que puede aparecer en el cielo después de la lluvia."
    },

    {
        palabra: "PLANETA",
        categoria: "🚀 Espacio",
        pista: "Cuerpo celeste que gira alrededor de una estrella."
    },

    {
        palabra: "ASTRONAUTA",
        categoria: "🚀 Espacio",
        pista: "Persona preparada para viajar al espacio."
    },

    {
        palabra: "MUSICA",
        categoria: "🎵 Arte",
        pista: "Puede escucharse con instrumentos o mediante la voz."
    },

    {
        palabra: "PELICULA",
        categoria: "🎬 Entretenimiento",
        pista: "Historia que podemos ver en una pantalla."
    },

    {
        palabra: "AMISTAD",
        categoria: "❤️ Valores",
        pista: "Relación entre personas que se tienen cariño y confianza."
    }

];


let palabraActual;

let letrasCorrectas = [];

let errores = 0;



function nuevoJuego() {


    const seleccion =
        palabras[Math.floor(Math.random() * palabras.length)];


    palabraActual =
        seleccion.palabra;


    letrasCorrectas = [];


    errores = 0;


    document.getElementById("categoria").textContent =
        seleccion.categoria;


    document.getElementById("pista").textContent =
        seleccion.pista;


    document.getElementById("errores").textContent =
        "0";


    document.getElementById("mensajeJuego").textContent =
        "";


    for (let i = 1; i <= 6; i++) {

        document.getElementById("parte" + i)
            .style.display = "none";

    }


    crearLetras();

    mostrarPalabra();

}



function mostrarPalabra() {


    let resultado = "";


    for (let letra of palabraActual) {


        if (letrasCorrectas.includes(letra)) {

            resultado += letra + " ";

        } else {

            resultado += "_ ";

        }

    }


    document.getElementById("palabra").textContent =
        resultado;


    if (!resultado.includes("_")) {


        document.getElementById("mensajeJuego").textContent =
            "🎉 ¡GANASTE! ¡Muy bien!";


        desactivarLetras();

    }

}



function crearLetras() {


    const contenedor =
        document.getElementById("letras");


    contenedor.innerHTML = "";


    const letras =
        "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";


    for (let letra of letras) {


        const boton =
            document.createElement("button");


        boton.textContent =
            letra;


        boton.onclick = function() {

            comprobarLetra(letra, boton);

        };


        contenedor.appendChild(boton);

    }

}



function comprobarLetra(letra, boton) {


    boton.disabled = true;


    if (palabraActual.includes(letra)) {


        letrasCorrectas.push(letra);


        boton.classList.add(
            "letra-correcta"
        );


        mostrarPalabra();


    } else {


        boton.classList.add(
            "letra-incorrecta"
        );


        errores++;


        document.getElementById("errores").textContent =
            errores;


        document.getElementById("parte" + errores)
            .style.display = "block";


        if (errores >= 6) {


            document.getElementById("mensajeJuego").textContent =
                "💡 La palabra era: " +
                palabraActual +
                ". ¡Inténtalo otra vez!";


            desactivarLetras();

        }

    }

}



function desactivarLetras() {


    const botones =
        document.querySelectorAll(
            "#letras button"
        );


    botones.forEach(function(boton) {

        boton.disabled = true;

    });

}


nuevoJuego();

</script>


</body>

</html>
