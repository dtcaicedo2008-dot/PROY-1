<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>El Ahorcado - GameZone SENA</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        🎮 GameZone SENA
    </div>

    <nav>

        <a href="dashboard.html">
            Inicio
        </a>

        <a href="acerca.html">
            Acerca de
        </a>

    </nav>

</header>



<main class="game-page ahorcado-page">


    <!-- TÍTULO -->

    <div class="titulo-juego">

        <span>🎯</span>

        <h1>¡Adivina la palabra!</h1>

        <span>✨</span>

    </div>


    <p class="subtitulo-ahorcado">

        ¡No te preocupes! Tienes pistas para ayudarte. 💜

    </p>



    <!-- INFORMACIÓN -->

    <div class="ayuda-ahorcado">

        <div>

            📚

            <strong>
                Categoría
            </strong>

            <span id="categoria">
                Animales
            </span>

        </div>


        <div>

            💡

            <strong>
                Pista
            </strong>

            <span id="pista">
                Pista
            </span>

        </div>

    </div>



    <!-- PERSONAJE -->

    <div class="personaje-ahorcado">

        <div class="nube">
            ☁️ ☁️
        </div>


        <div
            id="parte1"
            class="parte-personaje cabeza">

            😊

        </div>


        <div
            id="parte2"
            class="parte-personaje cuerpo">

            👕
            
        </div>


        <div
            id="parte3"
            class="parte-personaje brazo-izq">

            🤚

        </div>


        <div
            id="parte4"
            class="parte-personaje brazo-der">

            ✋

        </div>


        <div
            id="parte5"
            class="parte-personaje pierna-izq">

            🦵

        </div>


        <div
            id="parte6"
            class="parte-personaje pierna-der">

            🦵

        </div>


        <div class="suelo">
            🌱🌱🌱🌱🌱
        </div>

    </div>



    <!-- ERRORES -->

    <div class="errores-ahorcado">

        ❤️ Errores:

        <strong id="errores">
            0
        </strong>

        / 6

    </div>



    <!-- PALABRA -->

    <div
        id="palabra"
        class="palabra-ahorcado">

    </div>



    <!-- LETRAS -->

    <p class="elige-letra">

        👆 Elige una letra

    </p>


    <div
        id="letras"
        class="letras letras-bonitas">

    </div>



    <!-- MENSAJE -->

    <div
        id="mensajeJuego"
        class="mensaje-ahorcado">

    </div>



    <!-- NUEVO JUEGO -->

    <button
        onclick="nuevoJuego()"
        class="btn-principal">

        🔄 Nueva palabra

    </button>


    <br><br>


    <a
        href="dashboard.html"
        class="btn-secundario">

        ⬅ Volver a los juegos

    </a>


</main>



<script>


/* =====================================
   PALABRAS PARA NIÑOS
===================================== */

const palabras = [

    {
        palabra: "GATO",
        categoria: "🐾 Animales",
        pista: "Es un animal que dice miau."
    },

    {
        palabra: "PERRO",
        categoria: "🐾 Animales",
        pista: "Es el mejor amigo del ser humano."
    },

    {
        palabra: "LEON",
        categoria: "🐾 Animales",
        pista: "Es conocido como el rey de la selva."
    },

    {
        palabra: "CONEJO",
        categoria: "🐾 Animales",
        pista: "Tiene orejas largas y le gustan las zanahorias."
    },

    {
        palabra: "MARIPOSA",
        categoria: "🦋 Naturaleza",
        pista: "Tiene alas de muchos colores."
    },

    {
        palabra: "ARCOIRIS",
        categoria: "🌈 Naturaleza",
        pista: "Aparece en el cielo después de la lluvia."
    },

    {
        palabra: "SOL",
        categoria: "☀️ Naturaleza",
        pista: "Nos da luz y calor durante el día."
    },

    {
        palabra: "MANZANA",
        categoria: "🍎 Frutas",
        pista: "Es una fruta que puede ser roja, verde o amarilla."
    },

    {
        palabra: "BANANO",
        categoria: "🍌 Frutas",
        pista: "Es una fruta amarilla que se pela antes de comer."
    },

    {
        palabra: "PIZZA",
        categoria: "🍕 Comida",
        pista: "Tiene una masa redonda y puede llevar queso."
    },

    {
        palabra: "HELADO",
        categoria: "🍦 Comida",
        pista: "Es frío, dulce y tiene muchos sabores."
    },

    {
        palabra: "PELOTA",
        categoria: "⚽ Juegos",
        pista: "Es redonda y se utiliza para jugar."
    },

    {
        palabra: "ESCUELA",
        categoria: "📚 Lugares",
        pista: "Es el lugar donde aprendemos y estudiamos."
    },

    {
        palabra: "AMIGO",
        categoria: "❤️ Personas",
        pista: "Es una persona con quien compartimos y nos divertimos."
    },

    {
        palabra: "ESTRELLA",
        categoria: "🌌 Espacio",
        pista: "Brilla en el cielo durante la noche."
    }

];


let palabraActual;

let categoriaActual;

let pistaActual;

let letrasCorrectas = [];

let errores = 0;



/* =====================================
   NUEVO JUEGO
===================================== */

function nuevoJuego(){

    const seleccion =
        palabras[
            Math.floor(
                Math.random() *
                palabras.length
            )
        ];


    palabraActual =
        seleccion.palabra;


    categoriaActual =
        seleccion.categoria;


    pistaActual =
        seleccion.pista;


    letrasCorrectas = [];

    errores = 0;


    document.getElementById(
        "categoria"
    ).textContent =
        categoriaActual;


    document.getElementById(
        "pista"
    ).textContent =
        pistaActual;


    document.getElementById(
        "errores"
    ).textContent =
        "0";


    document.getElementById(
        "mensajeJuego"
    ).textContent =
        "";


    for(
        let i = 1;
        i <= 6;
        i++
    ){

        document.getElementById(
            "parte" + i
        ).style.display =
            "none";

    }


    crearLetras();

    mostrarPalabra();

}



/* =====================================
   MOSTRAR PALABRA
===================================== */

function mostrarPalabra(){

    let resultado = "";


    for(
        let letra of palabraActual
    ){

        if(
            letrasCorrectas.includes(
                letra
            )
        ){

            resultado +=
                letra + " ";

        }

        else{

            resultado +=
                "_ ";

        }

    }


    document.getElementById(
        "palabra"
    ).textContent =
        resultado;


    if(
        !resultado.includes("_")
    ){

        document.getElementById(
            "mensajeJuego"
        ).textContent =
            "🎉 ¡GANASTE! ¡Eres increíble! ⭐";

        desactivarLetras();

    }

}



/* =====================================
   CREAR LETRAS
===================================== */

function crearLetras(){

    const contenedor =
        document.getElementById(
            "letras"
        );


    contenedor.innerHTML = "";


    const letras =
        "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";


    for(
        let letra of letras
    ){

        let boton =
            document.createElement(
                "button"
            );


        boton.textContent =
            letra;


        boton.onclick =
            function(){

                comprobarLetra(
                    letra,
                    boton
                );

            };


        contenedor.appendChild(
            boton
        );

    }

}



/* =====================================
   COMPROBAR LETRA
===================================== */

function comprobarLetra(
    letra,
    boton
){

    boton.disabled = true;


    if(
        palabraActual.includes(
            letra
        )
    ){

        letrasCorrectas.push(
            letra
        );


        boton.classList.add(
            "letra-correcta"
        );


        mostrarPalabra();

    }

    else{

        boton.classList.add(
            "letra-incorrecta"
        );


        errores++;


        document.getElementById(
            "errores"
        ).textContent =
            errores;


        document.getElementById(
            "parte" + errores
        ).style.display =
            "block";


        if(
            errores >= 6
        ){

            document.getElementById(
                "mensajeJuego"
            ).textContent =
                "💜 ¡No pasa nada! La palabra era: " +
                palabraActual +
                " 😊";


            desactivarLetras();

        }

    }

}



/* =====================================
   DESACTIVAR LETRAS
===================================== */

function desactivarLetras(){

    const botones =
        document.querySelectorAll(
            "#letras button"
        );


    botones.forEach(
        boton => {

            boton.disabled = true;

        }
    );

}


nuevoJuego();

</script>


</body>

</html>
