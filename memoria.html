<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">🎮 GameZone</div>

    <nav>
        <a href="dashboard.html">Inicio</a>
        <a href="acerca.html">Acerca de</a>
    </nav>

</header>


<main class="game-page">

    <h1>🃏 Juego de Memoria</h1>

    <p>
        Encuentra todas las parejas.
    </p>

    <div id="tableroMemoria" class="tablero-memoria"></div>

    <h2 id="mensajeMemoria"></h2>

    <button onclick="iniciarMemoria()" class="btn-principal">
        🔄 Nuevo juego
    </button>

    <br><br>

    <a href="dashboard.html" class="btn-secundario">
        ⬅ Volver
    </a>

</main>


<script>

const simbolos = [
    "🍀",
    "🌙",
    "🔥",
    "⭐",
    "🌊",
    "🍎"
];


let cartas = [];
let primeraCarta = null;
let segundaCarta = null;
let bloqueo = false;
let parejas = 0;


function iniciarMemoria(){

    cartas = [
        ...simbolos,
        ...simbolos
    ];


    cartas.sort(() => Math.random() - 0.5);


    primeraCarta = null;
    segundaCarta = null;
    bloqueo = false;
    parejas = 0;


    document.getElementById("mensajeMemoria").textContent =
        "";


    const tablero =
        document.getElementById("tableroMemoria");


    tablero.innerHTML = "";


    cartas.forEach((simbolo, indice) => {

        const carta =
            document.createElement("button");


        carta.className = "carta";

        carta.dataset.simbolo = simbolo;

        carta.dataset.indice = indice;

        carta.textContent = "❓";


        carta.onclick = function(){

            voltearCarta(carta);

        };


        tablero.appendChild(carta);

    });

}


function voltearCarta(carta){

    if(
        bloqueo ||
        carta.classList.contains("volteada") ||
        carta === primeraCarta
    ){

        return;

    }


    carta.textContent =
        carta.dataset.simbolo;

    carta.classList.add("volteada");


    if(!primeraCarta){

        primeraCarta = carta;

        return;

    }


    segundaCarta = carta;

    comprobarPareja();

}


function comprobarPareja(){

    const sonIguales =
        primeraCarta.dataset.simbolo ===
        segundaCarta.dataset.simbolo;


    if(sonIguales){

        parejas++;

        primeraCarta = null;
        segundaCarta = null;


        if(parejas === simbolos.length){

            document.getElementById("mensajeMemoria").textContent =
                "🎉 ¡Ganaste! Encontraste todas las parejas.";

        }

    }

    else{

        bloqueo = true;


        setTimeout(() => {

            primeraCarta.textContent = "❓";
            segundaCarta.textContent = "❓";


            primeraCarta.classList.remove("volteada");
            segundaCarta.classList.remove("volteada");


            primeraCarta = null;
            segundaCarta = null;

            bloqueo = false;

        }, 900);

    }

}


iniciarMemoria();

</script>

</body>
</html>
