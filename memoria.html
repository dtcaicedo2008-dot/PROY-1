<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juego de Memoria</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="juego-pagina">


<h1>🧠 Juego de Memoria</h1>


<p>
Encuentra todas las parejas de cartas
</p>


<h3>
Movimientos:
<span id="movimientos">0</span>
</h3>



<div id="memoria"></div>



<h2 id="mensajeMemoria"></h2>



<button onclick="reiniciarJuego()">

🔄 Reiniciar

</button>



<br><br>



<a href="dashboard.html">

<button>
Volver al menú
</button>

</a>



</div>






<script>


let iconos=[

"🍎",
"⭐",
"🔥",
"🌙",
"🍀",
"🚀",
"🎮",
"💎"

];



let cartas=[...iconos,...iconos];


let primera=null;

let segunda=null;

let bloqueo=false;

let movimientos=0;

let parejas=0;





function iniciar(){


let tablero=document.getElementById("memoria");


tablero.innerHTML="";


cartas.sort(
()=>Math.random()-0.5
);



cartas.forEach(icono=>{


let carta=document.createElement("div");


carta.className="memoria-carta";


carta.dataset.icono=icono;


carta.innerHTML="❓";



carta.onclick=function(){


voltear(carta);


};



tablero.appendChild(carta);



});


}





function voltear(carta){



if(bloqueo)
return;



if(carta.innerHTML!="❓")
return;



carta.innerHTML=carta.dataset.icono;



if(!primera){


primera=carta;


}

else{


segunda=carta;


movimientos++;


document.getElementById("movimientos")
.innerHTML=movimientos;



comparar();


}



}






function comparar(){


if(
primera.dataset.icono==
segunda.dataset.icono
){


primera.style.background="#22c55e";

segunda.style.background="#22c55e";



primera=null;

segunda=null;


parejas++;



if(parejas==8){


document.getElementById("mensajeMemoria")
.innerHTML=
"🎉 ¡Ganaste el juego!";


}



}


else{


bloqueo=true;



setTimeout(()=>{


primera.innerHTML="❓";

segunda.innerHTML="❓";


primera=null;

segunda=null;


bloqueo=false;


},800);



}



}





function reiniciarJuego(){


movimientos=0;

parejas=0;


document.getElementById("movimientos")
.innerHTML=0;


document.getElementById("mensajeMemoria")
.innerHTML="";


iniciar();


}



iniciar();



</script>



</body>

</html>
