<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-icon">🎮</div>

        <h1>GameZone</h1>

        <p class="login-subtitle">
            ¡Bienvenido a nuestra zona de juegos!
        </p>

        <form id="loginForm">

            <label for="usuario">Usuario</label>

            <input 
                type="text" 
                id="usuario" 
                placeholder="Ingresa tu usuario"
                required
            >

            <label for="password">Contraseña</label>

            <input 
                type="password" 
                id="password" 
                placeholder="Ingresa tu contraseña"
                required
            >

            <button type="submit" class="btn-principal">
                🎮 Ingresar
            </button>

            <p id="mensajeError" class="error"></p>

        </form>

        <div class="datos-login">
            <p><strong>Usuario:</strong> admin</p>
            <p><strong>Contraseña:</strong> 1234</p>
        </div>

        <p class="sena-text">
            Programación de Software<br>
            Ficha 3180844
        </p>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let usuario = document.getElementById("usuario").value.trim();
            let password = document.getElementById("password").value;
            let mensaje = document.getElementById("mensajeError");

            if (usuario === "admin" && password === "1234") {

                // Obtener el número actual de personas
                let visitas = localStorage.getItem("visitas");

                if (visitas === null) {
                    visitas = 0;
                }

                // Aumentar una persona
                visitas++;

                // Guardar el nuevo número
                localStorage.setItem("visitas", visitas);

                // Entrar al dashboard
                window.location.href = "dashboard.html";

            } else {

                mensaje.textContent = "❌ Usuario o contraseña incorrectos.";

            }

        });
    </script>

</body>
</html>
