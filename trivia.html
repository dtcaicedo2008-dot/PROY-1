<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia - GameZone SENA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">🎮 GameZone SENA</div>

    <nav>
        <a href="dashboard.html">Inicio</a>
        <a href="acerca.html">Acerca de</a>
    </nav>
</header>

<main class="game-page trivia-page">

    <div class="titulo-juego">
        <span>🧠</span>
        <h1>Trivia Challenge</h1>
        <span>⚡</span>
    </div>

    <p class="subtitulo-trivia">
        Pon a prueba tus conocimientos y consigue la mayor cantidad de puntos.
    </p>

    <div class="progreso">
        <span id="numeroPregunta">Pregunta 1 de 10</span>
    </div>

    <div class="trivia-box">

        <div class="personaje-trivia">🎮</div>

        <h2 id="pregunta">Pregunta</h2>

        <div id="respuestas"></div>

        <p id="resultadoTrivia"></p>

    </div>

    <div class="puntaje-trivia">
        ⚡ Puntos: <strong id="puntaje">0</strong>
    </div>

    <br>

    <button id="siguiente"
            onclick="siguientePregunta()"
            class="btn-principal"
            style="display:none;">
        Siguiente ➡️
    </button>

    <div id="finalTrivia" style="display:none;">

        <div class="trivia-box">

            <div class="personaje-trivia">🏆</div>

            <h2>¡Trivia terminada!</h2>

            <p id="resultadoFinal"></p>

            <button onclick="reiniciarTrivia()" class="btn-principal">
                🔄 Jugar otra vez
            </button>

        </div>

    </div>

    <br><br>

    <a href="dashboard.html" class="btn-secundario">
        ⬅ Volver a los juegos
    </a>

</main>


<script>

const preguntas = [

    {
        pregunta: "🌎 ¿En qué continente se encuentra Colombia?",
        respuestas: ["Europa", "América", "Asia", "África"],
        correcta: "América"
    },

    {
        pregunta: "💻 ¿Cuál de estos es un lenguaje utilizado para crear páginas web?",
        respuestas: ["JavaScript", "Excel", "Photoshop", "Windows"],
        correcta: "JavaScript"
    },

    {
        pregunta: "⚽ ¿Cuántos jugadores tiene un equipo de fútbol en el campo?",
        respuestas: ["9", "10", "11", "12"],
        correcta: "11"
    },

    {
        pregunta: "🪐 ¿Cuál es el planeta conocido como el planeta rojo?",
        respuestas: ["Venus", "Marte", "Júpiter", "Saturno"],
        correcta: "Marte"
    },

    {
        pregunta: "🧪 ¿Cuál de estos elementos es necesario para que los seres humanos respiremos?",
        respuestas: ["Oxígeno", "Hierro", "Oro", "Carbono"],
        correcta: "Oxígeno"
    },

    {
        pregunta: "🎵 ¿Cuántas notas musicales básicas existen?",
        respuestas: ["5", "6", "7", "8"],
        correcta: "7"
    },

    {
        pregunta: "🧠 ¿Qué órgano controla principalmente el cuerpo humano?",
        respuestas: ["El corazón", "El cerebro", "El pulmón", "El estómago"],
        correcta: "El cerebro"
    },

    {
        pregunta: "🏀 ¿En qué deporte se utiliza principalmente una canasta?",
        respuestas: ["Fútbol", "Tenis", "Baloncesto", "Natación"],
        correcta: "Baloncesto"
    },

    {
        pregunta: "🔢 ¿Cuál es el resultado de 12 × 5?",
        respuestas: ["50", "55", "60", "65"],
        correcta: "60"
    },

    {
        pregunta: "🚀 ¿Cuál es el planeta más cercano al Sol?",
        respuestas: ["Mercurio", "Tierra", "Marte", "Júpiter"],
        correcta: "Mercurio"
    }

];


let preguntaActual = 0;
let puntos = 0;


function mostrarPregunta() {

    const pregunta = preguntas[preguntaActual];

    document.getElementById("numeroPregunta").textContent =
        "Pregunta " + (preguntaActual + 1) +
        " de " + preguntas.length;

    document.getElementById("pregunta").textContent =
        pregunta.pregunta;

    const contenedor =
        document.getElementById("respuestas");

    contenedor.innerHTML = "";

    document.getElementById("resultadoTrivia").textContent = "";

    pregunta.respuestas.forEach(function(respuesta) {

        const boton = document.createElement("button");

        boton.textContent = respuesta;

        boton.onclick = function() {
            responder(respuesta);
        };

        contenedor.appendChild(boton);

    });

    document.getElementById("siguiente").style.display = "none";
}


function responder(respuesta) {

    const correcta =
        preguntas[preguntaActual].correcta;

    const botones =
        document.querySelectorAll("#respuestas button");

    botones.forEach(function(boton) {

        boton.disabled = true;

        if (boton.textContent === correcta) {

            boton.classList.add("respuesta-correcta");

        }

    });


    if (respuesta === correcta) {

        puntos++;

        document.getElementById("resultadoTrivia").textContent =
            "🎉 ¡Correcto! Ganaste 1 punto.";

    } else {

        document.getElementById("resultadoTrivia").textContent =
            "❌ Incorrecto. La respuesta correcta era: " + correcta;

    }


    document.getElementById("puntaje").textContent =
        puntos;

    document.getElementById("siguiente").style.display =
        "inline-block";
}


function siguientePregunta() {

    preguntaActual++;

    if (preguntaActual < preguntas.length) {

        mostrarPregunta();

    } else {

        terminarTrivia();

    }

}


function terminarTrivia() {

    document.querySelector(".trivia-box").style.display =
        "none";

    document.getElementById("siguiente").style.display =
        "none";

    document.querySelector(".puntaje-trivia").style.display =
        "none";

    document.getElementById("finalTrivia").style.display =
        "block";


    let mensaje = "";


    if (puntos === 10) {

        mensaje =
            "🏆 ¡PERFECTO! Respondiste todas correctamente.";

    } else if (puntos >= 8) {

        mensaje =
            "🔥 ¡Excelente! Tienes muy buenos conocimientos.";

    } else if (puntos >= 6) {

        mensaje =
            "⭐ ¡Muy bien! Estuviste cerca de conseguir más.";

    } else if (puntos >= 4) {

        mensaje =
            "💪 Buen intento. ¡Puedes mejorar tu puntuación!";

    } else {

        mensaje =
            "🎮 Sigue practicando y vuelve a intentarlo.";

    }


    document.getElementById("resultadoFinal").textContent =
        "Obtuviste " + puntos +
        " de " + preguntas.length +
        " puntos. " +
        mensaje;
}


function reiniciarTrivia() {

    preguntaActual = 0;

    puntos = 0;

    document.querySelector(".trivia-box").style.display =
        "block";

    document.querySelector(".puntaje-trivia").style.display =
        "inline-block";

    document.getElementById("finalTrivia").style.display =
        "none";

    document.getElementById("puntaje").textContent =
        "0";

    mostrarPregunta();

}


mostrarPregunta();

</script>

</body>
</html>
