<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trivia Infantil - GameZone SENA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        🎮 GameZone SENA
    </div>

    <nav>
        <a href="dashboard.html">Inicio</a>
        <a href="acerca.html">Acerca de</a>
    </nav>

</header>


<main class="game-page trivia-page">

    <div class="titulo-juego">

        <span>🧠</span>

        <h1>Trivia Divertida</h1>

        <span>⭐</span>

    </div>

    <p class="subtitulo-trivia">
        ¡Responde las preguntas y demuestra cuánto sabes! 🌈
    </p>


    <!-- PROGRESO -->

    <div class="progreso">

        <span id="numeroPregunta">
            Pregunta 1 de 10
        </span>

    </div>


    <!-- CAJA DE PREGUNTA -->

    <div class="trivia-box">

        <div class="personaje-trivia">
            🧒
        </div>

        <h2 id="pregunta">
            Pregunta
        </h2>

        <div id="respuestas">
        </div>

        <p id="resultadoTrivia"></p>

    </div>


    <!-- PUNTAJE -->

    <div class="puntaje-trivia">

        ⭐ Puntos:
        <strong id="puntaje">
            0
        </strong>

    </div>


    <button
        id="siguiente"
        onclick="siguientePregunta()"
        class="btn-principal"
        style="display:none;">

        Siguiente ➡️

    </button>


    <div id="finalTrivia" style="display:none;">

        <h2>🎉 ¡Terminaste la Trivia!</h2>

        <p id="resultadoFinal"></p>

        <button
            onclick="reiniciarTrivia()"
            class="btn-principal">

            🔄 Jugar otra vez

        </button>

    </div>


    <br>

    <a href="dashboard.html" class="btn-secundario">
        ⬅ Volver a los juegos
    </a>

</main>


<script>

/* =====================================
   PREGUNTAS PARA NIÑOS
===================================== */

const preguntas = [

    {
        pregunta: "🐶 ¿Qué animal hace 'guau guau'?",
        respuestas: [
            "Gato",
            "Perro",
            "Vaca",
            "Pato"
        ],
        correcta: "Perro"
    },

    {
        pregunta: "🌈 ¿Cuántos colores tiene normalmente el arcoíris?",
        respuestas: [
            "5",
            "6",
            "7",
            "10"
        ],
        correcta: "7"
    },

    {
        pregunta: "🐱 ¿Cuál de estos animales dice 'miau'?",
        respuestas: [
            "Gato",
            "León",
            "Caballo",
            "Pez"
        ],
        correcta: "Gato"
    },

    {
        pregunta: "🌎 ¿En qué planeta vivimos?",
        respuestas: [
            "Marte",
            "La Tierra",
            "Júpiter",
            "La Luna"
        ],
        correcta: "La Tierra"
    },

    {
        pregunta: "🍎 ¿De qué color es normalmente una manzana roja?",
        respuestas: [
            "Azul",
            "Verde",
            "Rojo",
            "Morado"
        ],
        correcta: "Rojo"
    },

    {
        pregunta: "🐟 ¿Dónde viven principalmente los peces?",
        respuestas: [
            "En el agua",
            "En los árboles",
            "En el desierto",
            "En las nubes"
        ],
        correcta: "En el agua"
    },

    {
        pregunta: "☀️ ¿Qué nos da luz durante el día?",
        respuestas: [
            "La Luna",
            "El Sol",
            "Las estrellas",
            "Una nube"
        ],
        correcta: "El Sol"
    },

    {
        pregunta: "🐘 ¿Cuál es un animal muy grande y tiene una trompa?",
        respuestas: [
            "Conejo",
            "Elefante",
            "Gato",
            "Gallina"
        ],
        correcta: "Elefante"
    },

    {
        pregunta: "🧙‍♂️ ¿Qué personaje suele usar una varita mágica?",
        respuestas: [
            "Mago",
            "Panadero",
            "Piloto",
            "Doctor"
        ],
        correcta: "Mago"
    },

    {
        pregunta: "🚗 ¿Qué vehículo tiene cuatro ruedas y normalmente usamos para viajar por carretera?",
        respuestas: [
            "Avión",
            "Barco",
            "Carro",
            "Bicicleta"
        ],
        correcta: "Carro"
    }

];


let preguntaActual = 0;
let puntos = 0;


/* =====================================
   MOSTRAR PREGUNTA
===================================== */

function mostrarPregunta(){

    const pregunta =
        preguntas[preguntaActual];


    document.getElementById("numeroPregunta").textContent =
        "Pregunta " +
        (preguntaActual + 1) +
        " de " +
        preguntas.length;


    document.getElementById("pregunta").textContent =
        pregunta.pregunta;


    const contenedor =
        document.getElementById("respuestas");


    contenedor.innerHTML = "";


    document.getElementById("resultadoTrivia").textContent =
        "";


    pregunta.respuestas.forEach((respuesta, indice) => {

        const boton =
            document.createElement("button");


        boton.textContent =
            respuesta;


        boton.onclick = function(){

            responder(respuesta);

        };


        contenedor.appendChild(boton);

    });


    document.getElementById("siguiente").style.display =
        "none";

}


/* =====================================
   RESPONDER
===================================== */

function responder(respuesta){

    const correcta =
        preguntas[preguntaActual].correcta;


    const botones =
        document.querySelectorAll(
            "#respuestas button"
        );


    botones.forEach(boton => {

        boton.disabled = true;

        if(boton.textContent === correcta){

            boton.classList.add("respuesta-correcta");

        }

    });


    if(respuesta === correcta){

        puntos++;

        document.getElementById("resultadoTrivia").textContent =
            "🎉 ¡Muy bien! Respuesta correcta.";

    }

    else{

        document.getElementById("resultadoTrivia").textContent =
            "😊 ¡Casi! La respuesta era: " +
            correcta;

    }


    document.getElementById("puntaje").textContent =
        puntos;


    document.getElementById("siguiente").style.display =
        "inline-block";

}


/* =====================================
   SIGUIENTE PREGUNTA
===================================== */

function siguientePregunta(){

    preguntaActual++;


    if(preguntaActual < preguntas.length){

        mostrarPregunta();

    }

    else{

        terminarTrivia();

    }

}


/* =====================================
   TERMINAR
===================================== */

function terminarTrivia(){

    document.querySelector(".trivia-box").style.display =
        "none";

    document.getElementById("siguiente").style.display =
        "none";

    document.querySelector(".puntaje-trivia").style.display =
        "none";

    document.getElementById("finalTrivia").style.display =
        "block";


    let mensaje = "";


    if(puntos === 10){

        mensaje =
            "🏆 ¡Perfecto! Respondiste todo correctamente.";

    }

    else if(puntos >= 7){

        mensaje =
            "🌟 ¡Excelente! Sabes muchísimo.";

    }

    else if(puntos >= 5){

        mensaje =
            "😊 ¡Muy bien! Sigue practicando.";

    }

    else{

        mensaje =
            "💪 ¡Buen intento! Puedes volver a jugar.";

    }


    document.getElementById("resultadoFinal").textContent =
        "Conseguiste " +
        puntos +
        " de " +
        preguntas.length +
        " puntos. " +
        mensaje;

}


/* =====================================
   REINICIAR
===================================== */

function reiniciarTrivia(){

    preguntaActual = 0;

    puntos = 0;


    document.querySelector(".trivia-box").style.display =
        "block";

    document.querySelector(".puntaje-trivia").style.display =
        "block";

    document.getElementById("finalTrivia").style.display =
        "none";

    document.getElementById("puntaje").textContent =
        "0";


    mostrarPregunta();

}


mostrarPregunta();

</script>

</body>
</html>
