><!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel o Tijera</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">🎮 GameZone</div>

    <nav>
        <a href="dashboard.html">Inicio</a>
        <a href="acerca.html">Acerca de</a>
    </nav>

</header>


<main class="game-page">

    <h1>✊ Piedra, Papel o Tijera ✂️</h1>

    <p>¡Elige una opción!</p>

    <div class="opciones-ppt">

        <button onclick="jugar('Piedra')">
            ✊<br>Piedra
        </button>

        <button onclick="jugar('Papel')">
            📄<br>Papel
        </button>

        <button onclick="jugar('Tijera')">
            ✂️<br>Tijera
        </button>

    </div>

    <div class="resultado">

        <p id="jugador"></p>

        <p id="computadora"></p>

        <h2 id="resultadoFinal"></h2>

        <p id="marcador">
            Tú: 0 | Computadora: 0
        </p>

    </div>

    <a href="dashboard.html" class="btn-secundario">
        ⬅ Volver
    </a>

</main>


<script>

let puntosJugador = 0;
let puntosComputadora = 0;


function jugar(eleccionJugador){

    const opciones = [
        "Piedra",
        "Papel",
        "Tijera"
    ];

    const eleccionComputadora =
        opciones[Math.floor(Math.random() * 3)];


    document.getElementById("jugador").textContent =
        "👤 Tú elegiste: " + eleccionJugador;

    document.getElementById("computadora").textContent =
        "🤖 Computadora eligió: " + eleccionComputadora;


    let resultado = "";


    if(eleccionJugador === eleccionComputadora){

        resultado = "🤝 ¡Empate!";

    }

    else if(

        (eleccionJugador === "Piedra" &&
        eleccionComputadora === "Tijera") ||

        (eleccionJugador === "Papel" &&
        eleccionComputadora === "Piedra") ||

        (eleccionJugador === "Tijera" &&
        eleccionComputadora === "Papel")

    ){

        resultado = "🎉 ¡Ganaste!";
        puntosJugador++;

    }

    else{

        resultado = "😢 ¡Ganó la computadora!";
        puntosComputadora++;

    }


    document.getElementById("resultadoFinal").textContent =
        resultado;

    document.getElementById("marcador").textContent =
        "Tú: " + puntosJugador +
        " | Computadora: " + puntosComputadora;

}

</script>

</body>
</html>
